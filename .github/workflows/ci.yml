name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Module provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run benchmark
      - run: npm run package:coordinator
      - run: unzip -t dist/pharos-security-coordinator.zip
      - run: npm run check:modules
      - run: npm audit --audit-level=high

  skill-inspector:
    name: Skill Inspector (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: skill-inspector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps --wheel-dir dist-wheel

  contract-inspector:
    name: Contract Inspector (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: contract-inspector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: contract-inspector/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run

  address-intelligence:
    name: Address Intelligence (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: address-intelligence
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: address-intelligence/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
