name: Explorer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socialscan:
    name: SocialScan (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: [atlantic_testnet, pacific_mainnet]
    env:
      SOCIALSCAN_API_KEY: ${{ secrets.SOCIALSCAN_API_KEY }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require SocialScan credential
        run: |
          if [ -z "$SOCIALSCAN_API_KEY" ]; then
            echo "::error::Configure the SOCIALSCAN_API_KEY repository secret"
            exit 1
          fi

      - run: npm run smoke:explorer -- ${{ matrix.network }}
